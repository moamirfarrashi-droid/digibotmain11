name: DigiHinet Catch Up
on:
  schedule:
    - cron: '4-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: digihinet-publisher
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5
      - name: Check overdue-delivery logic
        run: python -m unittest test_publish_due -v
      - name: Git identity
        run: |
          git config user.name 'digihinet-bot'
          git config user.email 'digihinet-bot@users.noreply.github.com'
      - name: Publish missing due posts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          ENABLE_POSTING: ${{ vars.ENABLE_POSTING }}
          ENABLE_AI_POSTING: ${{ vars.ENABLE_AI_POSTING }}
          ENABLE_AI_NEWS: ${{ vars.ENABLE_AI_NEWS }}
          PERSIST_STATE: 'true'
        run: python publish_due.py
