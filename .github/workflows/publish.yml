name: DigiHinet Channel
on:
  schedule:
    - cron: '47 14 * * *' # 18:17 Asia/Tehran; execution can be delayed
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview = no send, test = test channel, publish = main channel'
        type: choice
        default: preview
        options: [preview, test, publish]
      kind:
        description: 'Content type'
        type: choice
        default: auto
        options: [auto, text, card, article, portfolio, video]
permissions:
  contents: write
concurrency:
  group: digihinet-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run checks
        run: python -m unittest test_bot -v
      - name: Git identity
        run: |
          git config user.name 'digihinet-bot'
          git config user.email 'digihinet-bot@users.noreply.github.com'
      - name: Prepare or publish
        env:
          RUN_MODE: ${{ inputs.mode || 'publish' }}
          CONTENT_KIND: ${{ inputs.kind || 'auto' }}
          ENABLE_POSTING: ${{ vars.ENABLE_POSTING }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_TEST_CHANNEL_ID: ${{ secrets.TELEGRAM_TEST_CHANNEL_ID }}
          PERSIST_STATE: 'true'
        run: python bot.py --mode "$RUN_MODE" --kind "$CONTENT_KIND"
      - name: Downloadable preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-preview-${{ github.run_id }}
          path: out/
          retention-days: 3
          if-no-files-found: ignore
