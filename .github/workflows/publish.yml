name: DigiHinet 20 Days
on:
  schedule:
    - cron: '30 3 * * *' # 07:00 Tehran
    - cron: '30 5 * * *' # 09:00 Tehran
    - cron: '30 7 * * *' # 11:00 Tehran
    - cron: '30 9 * * *' # 13:00 Tehran
    - cron: '30 11 * * *' # 15:00 Tehran
    - cron: '0 15 * * *' # 18:30 Tehran
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview / test / publish'
        type: choice
        default: preview
        options: [preview, test, publish]
      day:
        description: 'Preview/test day 1–20; use 0 for automatic publish day'
        default: '0'
        type: string
      slot:
        description: 'Slot 1–6'
        default: '1'
        type: choice
        options: ['1', '2', '3', '4', '5', '6']
permissions:
  contents: write
concurrency:
  group: digihinet-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5
      - name: Check campaign
        run: python -m unittest test_campaign20 test_posting_hours -v
      - name: Git identity
        run: |
          git config user.name 'digihinet-bot'
          git config user.email 'digihinet-bot@users.noreply.github.com'
      - name: Publish one slot
        env:
          RUN_MODE: ${{ inputs.mode || 'publish' }}
          DAY: ${{ inputs.day || '0' }}
          SLOT: ${{ inputs.slot || '0' }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          ENABLE_POSTING: ${{ vars.ENABLE_POSTING }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_TEST_CHANNEL_ID: ${{ secrets.TELEGRAM_TEST_CHANNEL_ID }}
          PERSIST_STATE: 'true'
        run: python campaign20.py --mode "$RUN_MODE" --day "$DAY" --slot "$SLOT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-preview-${{ github.run_id }}
          path: out/
          retention-days: 3
          if-no-files-found: ignore

